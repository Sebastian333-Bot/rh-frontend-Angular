<div class="container mt-4">
    <h2 class="text-center">
        <i class="bi bi-person-plus-fill me-2 neon-icon"></i>Agregar empleado
    </h2>

    <form (ngSubmit)="onSubmit()" #f="ngForm" class="mt-3">
        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-person-vcard me-1 neon-icon"></i>Nombre
            </label>
            <input
                type="text"
                class="form-control"
                name="nombre"
                [(ngModel)]="empleado.nombre"
                required
                minlength="2"
                placeholder="Nombre completo" />
            <div class="form-text">Requerido, mínimo 2 caracteres.</div>
        </div>

        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-diagram-3 me-1 neon-icon"></i>Departamento
            </label>
            <input
                type="text"
                class="form-control"
                name="departamento"
                [(ngModel)]="empleado.departamento"
                required
                placeholder="Ej. Ventas, TI, RH" />
        </div>

        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-currency-dollar me-1 neon-icon"></i>Sueldo
            </label>
            <input
                type="number"
                class="form-control"
                name="sueldo"
                [(ngModel)]="empleado.sueldo"
                required
                min="0"
                step="0.01"
                placeholder="0.00" />
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit" [disabled]="f.invalid || guardando">
                <i class="bi bi-floppy-fill me-2 neon-icon"></i>
                {{ guardando ? 'Guardando...' : 'Guardar' }}
            </button>
            <a class="btn btn-outline-secondary" routerLink="/empleados">
                <i class="bi bi-x-circle me-2 neon-icon"></i>Cancelar
            </a>
        </div>
         @if (error){
        <div class="alert alert-danger mt-3">
            <i class="bi bi-exclamation-triangle-fill me-2 neon-icon"></i>{{ error }}
        </div>
         }
    </form>
</div>
